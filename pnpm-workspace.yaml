packages:
  - 'apps/*'
  - 'packages/*'
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - argon2
  - esbuild
  - '@scarf/scarf'
  - '@parcel/watcher'
  - '@swc/core'
  - unrs-resolver
  - msgpackr-extract
overrides:
  'uuid@<11.1.1': '^11.1.1'
  'js-yaml@>=5.0.0 <5.4.1': '>=5.4.1'
  'deepmerge-ts@<8.0.0': '>=8.0.0'
# pnpm 12: lista de paquetes cuyos scripts de instalación se permiten (binarios nativos de Prisma, argon2, esbuild…).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  'prisma': true
  'argon2': true
  'esbuild': true
  '@scarf/scarf': true
  '@parcel/watcher': true
  '@swc/core': true
  'unrs-resolver': true
  'msgpackr-extract': true
minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/eslint-plugin-next@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - eslint-config-next@16.4.3
  - next@16.4.3
