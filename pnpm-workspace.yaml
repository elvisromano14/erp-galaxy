packages:
  - 'apps/*'
  - 'packages/*'
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - argon2
  - esbuild
  - '@scarf/scarf'
  - '@parcel/watcher'
  - '@swc/core'
  - unrs-resolver
  - msgpackr-extract
overrides:
  'uuid@<11.1.1': '^11.1.1'
  'js-yaml@>=5.0.0 <5.4.1': '>=5.4.1'
  'deepmerge-ts@<8.0.0': '>=8.0.0'
# pnpm 12: lista de paquetes cuyos scripts de instalación se permiten (binarios nativos de Prisma, argon2, esbuild…).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  'prisma': true
  'argon2': true
  'esbuild': true
  '@scarf/scarf': true
  '@parcel/watcher': true
  '@swc/core': true
  'unrs-resolver': true
  'msgpackr-extract': true
